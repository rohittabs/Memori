document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ cd.onDelete }}\" aria-label=\"Delete card\" style=\"width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ deck.noResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:26px 20px;background:var(--card);border:1px dashed var(--border2);border-radius:18px;color:var(--text2);font-size:13px;font-weight:600\">No cards match your search.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ deck.noCards }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:30px 20px;background:var(--card);border:1px dashed var(--border2);border-radius:18px\">\n              <div style=\"font-size:14px;font-weight:800\">This deck is empty<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--text2);margin-top:5px\">Add your first card to begin.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ deck.onAddCard }}\" style=\"margin-top:14px;background:var(--brand-grad);color:#fff;font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:12px\">Add card<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRevise }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:6px 18px 8px;animation:mFade .3s ease\">\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:18px;box-shadow:var(--card-shadow)\">\n          <div style=\"font-size:12.5px;color:var(--text2);font-weight:600;line-height:1.55;text-wrap:pretty\">{{ revise.intro }}<\u002Fdiv>\n          <sc-if value=\"{{ revise.hasDue }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ revise.onReview }}\" style=\"margin-top:14px;width:100%;padding:14px;border-radius:14px;background:var(--brand-grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 12px 26px -8px var(--hero-glow)\">{{ revise.reviewLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);margin:22px 2px 12px\">Revise a deck<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ revise.decks }}\" as=\"rd\" hint-placeholder-count=\"1\">\n            <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:18px;box-shadow:var(--card-shadow);display:flex;align-items:stretch;overflow:hidden\">\n              <div style=\"width:7px;flex:none;background:{{ rd.grad }}\"><\u002Fdiv>\n              <div style=\"flex:1;padding:13px 14px 13px 15px;min-width:0;display:flex;align-items:center;gap:12px\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ rd.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--text2);font-weight:600;margin-top:2px\">{{ rd.count }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex:none\">\n                  <button sc-camel-on-click=\"{{ rd.onFlip }}\" style=\"display:inline-flex;align-items:center;gap:5px;padding:9px 13px;border-radius:11px;background:var(--surface2);border:1px solid var(--border2);font-size:12.5px;font-weight:700;color:var(--text)\"><svg width=\"15\" height=\ \n          <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:14px 14px 13px;box-shadow:var(--card-shadow)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)\">Time studied<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:800;line-height:1;margin-top:9px\">{{ stats.timeLabel }}<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;color:var(--text2);margin-top:6px\">{{ stats.secPerCardLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:14px 14px 13px;box-shadow:var(--card-shadow)\">\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)\">Avg stability<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:800;line-height:1;margin-top:9px;color:var(--primary)\">{{ stats.avgIvLabel }}<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;color:var(--text2);margin-top:6px\">{{ stats.avgStabilitySub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:17px;box-shadow:var(--card-shadow);margin-top:13px\">\n          <div style=\"font-size:14.5px;font-weight:800;margin-bottom:13px\">Study activity<\u002Fdiv>\n          <div style=\"display:flex;gap:3px;justify-content:center\">\n            <sc-for list=\"{{ stats.heatCols }}\" as=\"col\" hint-placeholder-count=\"15\">\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <sc-for list=\"{{ col }}\" as=\"cell\" hint-placeholder-count=\"7\">\n                  <div style=\"width:13px;height:13px;border-radius:3px;background:{{ cell.color }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:12px\">\n            <span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">Less<\u002Fspan>\n            <sc-for list=\"{{ stats.hmLevels }}\" as=\"lv\" hint-placeholder-count=\"4\"><span style=\"width:12px;height:12px;border-radius:3px;background:{{ lv.color }}\"><\u002Fspan><\u002Fsc-for>\n            <span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">More<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:17px;box-shadow:var(--card-shadow);margin-top:13px\">\n          <div style=\"font-size:14.5px;font-weight:800;margin-bottom:14px\">Reviews, last 14 days<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:5px;height:104px\">\n            <sc-for list=\"{{ stats.bars }}\" as=\"bar\" hint-placeholder-count=\"14\">\n              <div style=\"flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center\"><div style=\"width:100%;max-width:20px;height:{{ bar.hCss }};background:{{ bar.barBg }};display:flex;flex-direction:column;border-radius:5px 5px 3px 3px;overflow:hidden;transition:height .5s cubic-bezier(.2,.8,.2,1)\"><div style=\"height:{{ bar.forgFrac }};background:var(--red)\"><\u002Fdiv><div style=\"height:{{ bar.recFrac }};background:var(--st-mastered)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;margin-top:11px\">\n            <span style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);font-weight:600\"><span style=\"width:9px;height:9px;border-radius:3px;background:var(--st-mastered)\"><\u002Fspan>recalled<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);font-weight:600\"><span style=\"width:9px;height:9px;border-radius:3px;background:var(--red)\"><\u002Fspan>forgotten<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:17px;box-shadow:var(--card-shadow);margin-top:13px\">\n          <div style=\"font-size:14.5px;font-weight:800;margin-bottom:3px\">Coming up<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text2);margin-bottom:14px\">{{ stats.comingTotal }} cards scheduled over the next three weeks.<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:4px;height:92px\">\n            <sc-for list=\"{{ stats.coming }}\" as=\"cm\" hint-placeholder-count=\"21\">\n              <div style=\"flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center\"><div style=\"width:100%;max-width:13px;height:{{ cm.heightCss }};background:{{ cm.color }};border-radius:4px 4px 2px 2px\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin-top:9px\"><span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">Today<\u002Fspan><span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">3 weeks<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ stats.comingHasNewNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:13px;padding:10px 13px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text2)\">{{ stats.comingNewNote }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ stats.comingHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:13px\">\n              <sc-for list=\"{{ stats.comingRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--border)\">\n                  <div style=\"font-size:12.5px;font-weight:800;flex:none;width:82px;padding-top:2px\">{{ row.label }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ row.chips }}\" as=\"chip\" hint-placeholder-count=\"1\">\n                      <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text2);background:var(--surface2);border:1px solid var(--border);padding:4px 9px;border-radius:8px\"><span style=\"width:11px;height:11px;border-radius:4px;background:{{ chip.grad }};flex:none\"><\u002Fspan>{{ chip.name }} {{ chip.count }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;font-weight:600;color:var(--text3);flex:none;padding-top:3px\">{{ row.total }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ stats.comingHasMore }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:11.5px;font-weight:600;color:var(--text3);padding-top:10px;border-top:1px solid var(--border)\">{{ stats.comingMore }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:17px;box-shadow:var(--card-shadow);margin-top:13px\">\n          <div style=\"font-size:14.5px;font-weight:800;margin-bottom:10px\">Accuracy trend<\u002Fdiv>\n          <sc-if value=\"{{ stats.hasLine }}\" hint-placeholder-val=\"{{ true }}\">\n            <svg sc-camel-view-box=\"0 0 {{ stats.accW }} {{ stats.accH }}\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:104px;display:block;overflow:visible\">\n              <defs><linearGradient id=\"mAccGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--primary)\" stop-opacity=\"0.34\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--primary)\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n              <path d=\"{{ stats.areaPath }}\" fill=\"url(#mAccGrad)\"><\u002Fpath>\n              <path d=\"{{ stats.linePath }}\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n              <circle cx=\"{{ stats.lastAccPt.x }}\" cy=\"{{ stats.lastAccPt.y }}\" r=\"4\" fill=\"var(--primary)\" stroke=\"var(--card)\" stroke-width=\"2.5\"><\u002Fcircle>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between;margin-top:4px\"><span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">0%<\u002Fspan><span style=\"font-size:10.5px;color:var(--text3);font-weight:600\">100%<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ stats.accEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--text2);padding:18px 0;text-align:center\">Study a few more days to see your accuracy trend.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ stats.fcHasData }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:17px;box-shadow:var(--card-shadow);margin-top:13px\">\n          <div style=\"font-size:14.5px;font-weight:800;margin-bottom:4px\">Your forgetting curve<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:14px\">Modelled for a card with your average stability. The scheduler picks the moment the curve crosses your target retention.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <div style=\"display:flex;flex-direction:column;justify-content:space-between;height:150px;font-size:9.5px;color:var(--text3);font-weight:700;text-align:right;flex:none;width:32px\"><span>100%<\u002Fspan><span>90%<\u002Fspan><span style=\"margin-top:auto;margin-bottom:auto\">50%<\u002Fspan><span>0%<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1;position:relative;min-width:0\">\n              <svg sc-camel-view-box=\"0 0 300 150\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:150px;display:block;overflow:visible\">\n                <defs>\n                  <linearGradient id=\"mFcStroke\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"var(--pink)\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--indigo2)\"><\u002Fstop><\u002FlinearGradient>\n                  <linearGradient id=\"mFcFill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--pink)\" stop-opacity=\"0.26\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--indigo2)\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient>\n                <\u002Fdefs>\n                <line x1=\"0\" y1=\"{{ stats.fcY90 }}\" x2=\"300\" y2=\"{{ stats.fcY90 }}\" stroke=\"var(--border)\" stroke-width=\"1\"><\u002Fline>\n                <line x1=\"0\" y1=\"{{ stats.fcY50 }}\" x2=\"300\" y2=\"{{ stats.fcY50 }}\" stroke=\"var(--border)\" stroke-width=\"1\"><\u002Fline>\n                <path d=\"{{ stats.fcArea }}\" fill=\"url(#mFcFill)\"><\u002Fpath>\n                <path d=\"{{ stats.fcLine }}\" fill=\"none\" stroke=\"url(#mFcStroke)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <line x1=\"{{ stats.fcNextX }}\" y1=\"0\" x2=\"{{ stats.fcNextX }}\" y2=\"150\" stroke=\"var(--due)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"><\u002Fline>\n              <\u002Fsvg>\n              <div style=\"font-size:10.5px;color:var(--text2);font-weight:600;font-family:ui-monospace,monospace;margin-top:6px;text-align:center\">{{ stats.fcNextLabel }}<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;margin-top:2px\"><span style=\"font-size:10px;color:var(--text3);font-weight:700;font-family:ui-monospace,monospace\">0d<\u002Fspan><span style=\"font-size:10px;color:var(--text3);font-weight:700;font-family:ui-monospace,monospace\">{{ stats.fcDomainLabel }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:18px;box-shadow:var(--card-shadow);margin-top:13px\">\n          <div style=\"font-size:14.5px;font-weight:800;margin-bottom:6px\">Overall breakdown<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:18px\">\n            <div style=\"position:relative;width:118px;height:118px;flex:none\">\n              <svg width=\"118\" height=\"118\" sc-camel-view-box=\"0 0 118 118\" style=\"transform:rotate(-90deg)\">\n                <circle cx=\"59\" cy=\"59\" r=\"{{ stats.donut.r }}\" fill=\"none\" stroke=\"var(--track)\" stroke-width=\"13\"><\u002Fcircle>\n                <sc-for list=\"{{ stats.donut.segs }}\" as=\"seg\" hint-placeholder-count=\"3\"><circle cx=\"59\" cy=\"59\" r=\"{{ stats.donut.r }}\" fill=\"none\" stroke=\"{{ seg.color }}\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-dasharray=\"{{ seg.dash }}\" stroke-dashoffset=\"{{ seg.offset }}\"><\u002Fcircle><\u002Fsc-for>\n              <\u002Fsvg>\n              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center\"><div style=\"font-size:27px;font-weight:800;line-height:1\">{{ stats.donut.total }}<\u002Fdiv><div style=\"font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em\">cards<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ stats.legend }}\" as=\"lg\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:11px;height:11px;border-radius:4px;background:{{ lg.color }};flex:none\"><\u002Fspan><span style=\"font-size:13px;font-weight:600;color:var(--text2);flex:1\">{{ lg.label }}<\u002Fspan><span style=\"font-size:13.5px;font-weight:800\">{{ lg.count }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);margin:22px 2px 12px\">Per deck progress<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ stats.perDeck }}\" as=\"pd\" hint-placeholder-count=\"1\">\n            <div sc-camel-on-click=\"{{ pd.open }}\" style=\"background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:14px 15px;box-shadow:var(--card-shadow);cursor:pointer\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n                <div style=\"display:flex;align-items:center;gap:10px;min-width:0\"><span style=\"width:11px;height:11px;border-radius:4px;background:{{ pd.grad }};flex:none\"><\u002Fspan><span style=\"font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ pd.name }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:13px;font-weight:800;color:var(--st-mastered);flex:none\">{{ pd.masteredPct }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:9px;border-radius:5px;background:var(--track);overflow:hidden;display:flex\">\n                <sc-for list=\"{{ pd.segs }}\" as=\"sg\" hint-placeholder-count=\"3\"><span style=\"height:100%;width:{{ sg.wCss }};background:{{ sg.color }}\"><\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:6px 18px 8px;animation:mFade .3s ease\">\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:16px 16px 6px;box-shadow:var(--card-shadow);margin-bottom:14px\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:14px\">Studying<\u002Fdiv>\n          <div style=\"font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text3)\">Target retention: {{ settings.study.retention }}%<\u002Fdiv>\n          <input type=\"range\" min=\"70\" max=\"97\" value=\"{{ settings.study.retention }}\" sc-camel-on-change=\"{{ settings.study.onRetention }}\" aria-label=\"Target retention\" style=\"width:100%;margin:11px 0 5px;accent-color:var(--primary)\">\n          <div style=\"font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:16px\">Higher means shorter intervals and more reviews. Around 90% is the usual sweet spot.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n            <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">New / day<\u002Fdiv><input type=\"number\" min=\"0\" value=\"{{ settings.study.newPerDay }}\" sc-camel-on-change=\"{{ settings.study.onNew }}\" style=\"width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;font-weight:700;outline:none\"><\u002Fdiv>\n            <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">Reviews / day<\u002Fdiv><input type=\"number\" min=\"0\" value=\"{{ settings.study.reviewsPerDay }}\" sc-camel-on-change=\"{{ settings.study.onReviews }}\" style=\"width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;font-weight:700;outline:none\"><\u002Fdiv>\n            <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">Daily goal<\u002Fdiv><input type=\"number\" min=\"1\" value=\"{{ settings.study.dailyGoal }}\" sc-camel-on-change=\"{{ settings.study.onGoal }}\" style=\"width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;font-weight:700;outline:none\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">Longest interval, days<\u002Fdiv><input type=\"number\" min=\"1\" value=\"{{ settings.study.maxInterval }}\" sc-camel-on-change=\"{{ settings.study.onMax }}\" style=\"width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;font-weight:700;outline:none\"><\u002Fdiv>\n          <div sc-camel-on-click=\"{{ settings.study.onShuffle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px 14px;margin-top:8px;border-top:1px solid var(--border);cursor:pointer\">\n            <div><div style=\"font-size:14.5px;font-weight:700\">Shuffle the queue<\u002Fdiv><div style=\"font-size:12px;color:var(--text2);margin-top:2px\">Mix due and new cards instead of a fixed order<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:48px;height:27px;border-radius:14px;background:{{ settings.study.shuffleTrack }};position:relative;transition:background .2s;flex:none\"><div style=\"position:absolute;top:2.5px;left:{{ settings.study.shuffleX }};width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 5px rgba(0,0,0,.3)\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ settings.study.onAudio }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-top:1px solid var(--border);cursor:pointer\">\n            <div><div style=\"font-size:14.5px;font-weight:700\">Play the first audio clip on reveal<\u002Fdiv><div style=\"font-size:12px;color:var(--text2);margin-top:2px\">Useful for pronunciation decks<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:48px;height:27px;border-radius:14px;background:{{ settings.study.audioTrack }};position:relative;transition:background .2s;flex:none\"><div style=\"position:absolute;top:2.5px;left:{{ settings.study.audioX }};width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 5px rgba(0,0,0,.3)\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:6px 6px;box-shadow:var(--card-shadow)\">\n          <div style=\"padding:12px 14px 8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)\">Appearance<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;padding:4px 12px 14px\">\n            <sc-for list=\"{{ settings.themes }}\" as=\"th\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ th.pick }}\" style=\"flex:1;padding:12px 4px;border-radius:14px;border:2px solid {{ th.border }};background:{{ th.bg }};color:{{ th.fg }};font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:7px\">\n                <span style=\"font-size:18px\">{{ th.icon }}<\u002Fspan>{{ th.label }}\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:6px;box-shadow:var(--card-shadow);margin-top:14px\">\n          <div style=\"padding:12px 14px 8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)\">Your data<\u002Fdiv>\n          <div style=\"padding:2px 8px 10px;display:flex;flex-direction:column;gap:2px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:11px 8px\">\n              <div><div style=\"font-size:14.5px;font-weight:700\">{{ settings.deckCount }} decks, {{ settings.cardCount }} cards<\u002Fdiv><div style=\"font-size:12px;color:var(--text2)\">Stored privately on this device.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ settings.onBackup }}\" style=\"display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:13px;text-align:left;color:var(--text)\">\n              <span style=\"width:38px;height:38px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--primary)\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1\"><span style=\"display:block;font-size:14.5px;font-weight:700\">Back up all data<\u002Fspan><span style=\"display:block;font-size:12px;color:var(--text2)\">Download a .json file of everything.<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n            <label style=\"display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:13px;text-align:left;color:var(--text);cursor:pointer\">\n              <span style=\"width:38px;height:38px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--teal)\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 9l5-5 5 5M12 4v12\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1\"><span style=\"display:block;font-size:14.5px;font-weight:700\">Restore from backup<\u002Fspan><span style=\"display:block;font-size:12px;color:var(--text2)\">Import a .json backup file.<\u002Fspan><\u002Fspan>\n              <input type=\"file\" accept=\"application/json,.json\" sc-camel-on-change=\"{{ settings.onRestore }}\" style=\"display:none\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ settings.onErase }}\" style=\"display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:13px;text-align:left;color:var(--red)\">\n              <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(240,71,95,.12);display:flex;align-items:center;justify-content:center;color:var(--red);flex:none\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1\"><span style=\"display:block;font-size:14.5px;font-weight:700\">Erase all data<\u002Fspan><span style=\"display:block;font-size:12px;color:var(--text2)\">Delete your decks and stats, restore the starter deck.<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:18px;box-shadow:var(--card-shadow);margin-top:14px\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:10px\">Support Memori<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text2);line-height:1.6\">Memori is free and always will be. If it has helped you learn and you feel like it, you can send anything you like. Completely optional.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px\">\n            <img src=\"7f649c62-ea97-4851-b67e-b3cdd5820bb0\" alt=\"\" style=\"width:26px;height:26px\">\n            <span style=\"font-size:15px;font-weight:800\">Rohit Mishra<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;margin-top:14px\">\n            <div style=\"background:#fff;padding:10px;border-radius:16px;border:1px solid var(--border)\"><img src=\"a0154b82-1677-435b-86d5-a41149fb2237\" alt=\"UPI payment QR code\" style=\"width:236px;height:auto;display:block\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;margin-top:12px\">\n            <div style=\"font-size:13px;color:var(--text2);line-height:1.6\">{{ settings.support.scanLine }}<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:800;color:var(--text);line-height:1.6\">acoustics1990@okhdfcbank<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ settings.support.onCopy }}\" style=\"width:100%;margin-top:14px;padding:13px;border-radius:13px;background:var(--surface2);border:1px solid var(--border2);font-size:14.5px;font-weight:700;color:var(--text)\">Copy UPI ID<\u002Fbutton>\n          <sc-if value=\"{{ settings.support.isAndroid }}\" hint-placeholder-val=\"{{ false }}\">\n            <a href=\"{{ settings.support.androidLink }}\" style=\"display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px;padding:14px;border-radius:13px;background:var(--brand-grad);color:#fff;font-size:14.5px;font-weight:800;box-shadow:0 10px 22px -8px var(--hero-glow)\">Pay with any UPI app<\u002Fa>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ settings.support.isIOS }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px\">\n              <sc-for list=\"{{ settings.support.iosApps }}\" as=\"app\" hint-placeholder-count=\"4\">\n                <a href=\"{{ app.href }}\" style=\"display:flex;align-items:center;justify-content:center;padding:13px;border-radius:13px;background:var(--surface2);border:1px solid var(--border2);font-size:14px;font-weight:700;color:var(--text)\">{{ app.label }}<\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:18px;box-shadow:var(--card-shadow);margin-top:14px\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:10px\">About<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text2);line-height:1.6\">Memori schedules reviews with spaced repetition. Each answer updates the card's interval and ease, and the next date is when your recall is predicted to drop to your target retention.<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text2);line-height:1.6;margin-top:10px\">Cards: <b style=\"color:var(--text)\">{{ settings.about.cards }}<\u002Fb>, decks: <b style=\"color:var(--text)\">{{ settings.about.decks }}<\u002Fb>, reviews logged: <b style=\"color:var(--text)\">{{ settings.about.reviews }}<\u002Fb>.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;padding:22px 10px 6px\">\n          <img src=\"7f649c62-ea97-4851-b67e-b3cdd5820bb0\" alt=\"\" style=\"width:40px;height:40px;opacity:.85;margin-bottom:8px\">\n          <div style=\"font-size:13px;font-weight:800;color:var(--text2)\">Memori<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--text3);margin-top:2px;line-height:1.5\">Free and open. Runs entirely in your browser: no account, no servers, no tracking.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n\n    <nav class=\"m-bottomnav\" style=\"flex:none;display:{{ navDisplay }};align-items:center;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);position:relative\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ tb.on }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:{{ tb.color }}\">\n          <span style=\"display:block\" data-om-raster=\"\">{{ tb.icon }}<\u002Fspan>\n          <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.01em\">{{ tb.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <sc-if value=\"{{ showFab }}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{ onFab }}\" aria-label=\"{{ fabLabel }}\" class=\"m-fab\" style=\"position:absolute;right:20px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:19px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -8px var(--hero-glow);animation:mPop .3s ease\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStudy }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column\">\n        <div style=\"flex:none;display:flex;align-items:center;gap:12px;paddin
